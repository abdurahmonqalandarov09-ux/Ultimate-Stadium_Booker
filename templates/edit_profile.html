{% extends 'base.html' %}
{% block title %}Редактировать профиль{% endblock %}
{% block content %}
<form class="form glass" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <h1>Редактировать профиль</h1>

    <label>Email</label>
    <input type="email" name="email" value="{{ user.email }}">

    <label>Телефон</label>
    <input type="text" name="phone" value="{{ user.phone }}">

    <label>О себе</label>
    <textarea name="about">{{ user.about }}</textarea>

    <label>Новое фото (если нужно заменить)</label>
    <input type="file" name="photo" accept="image/*">

    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn" href="{% url 'profile' %}">Отмена</a>
</form>
{% endblock %}
