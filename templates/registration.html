{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth glass">
    <h1>Регистрация</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Логин" required>
        <input type="email" name="email" placeholder="Email">
        <input type="password" name="password" placeholder="Пароль" required>
        <input type="text" name="phone" placeholder="Телефон (необязательно)">
        <textarea name="about" placeholder="О себе (необязательно)"></textarea>
        <label>Фото профиля (необязательно)</label>
        <input type="file" name="photo" accept="image/*">
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
    </form>
    <p class="muted">Уже есть аккаунт? <a href="{% url 'login' %}"><b>Войти</b></a></p>
</div>
{% endblock %}
